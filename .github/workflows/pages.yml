# Publishes the article (report/index.qmd) and the tag lookup app (app/) to GitHub Pages:
#   https://johnpospisil.github.io/stackoverflow-decline/       article
#   https://johnpospisil.github.io/stackoverflow-decline/app/   tag lookup
# Built from the committed model summaries and figures (report/qa, report/figures), so the raw
# dump is not needed. Runs only once the repository is public (Pages needs a public repo on the
# free plan); enable it under Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Render the article
        run: make report
      - name: Assemble the site
        run: |
          mkdir -p _site/app/data
          cp report/index.html _site/index.html
          cp app/index.html _site/app/index.html
          cp app/data/tags.json _site/app/data/tags.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
